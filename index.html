    <title>GitHub Dashboard</title>
    <script>
      // Restore the path that 404.html encoded into the query string.
      (function () {
        var params = new URLSearchParams(globalThis.location.search);
        var path = params.get('path');
        if (path) {
          params.delete('path');
          var remaining = params.toString();
          globalThis.history.replaceState(
            null, null,
            '/github-dashboard' + path + (remaining ? '?' + remaining : '') + globalThis.location.hash
          );
        }
      })();
    </script>
